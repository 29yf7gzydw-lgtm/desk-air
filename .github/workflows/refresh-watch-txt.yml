name: Refresh watch text files

# Refreshes ONLY wx.txt, aqi.txt and hist.txt for the Instinct 2 HttpClient Base URL setup.
# Touches nothing else: never wx.json, index.html, endpoints, or any secret.
# No secrets needed: wx.json is read from the repo checkout, CAMS + UV + ERA5 need no key.
#
# Formats (TRMNL-style text, HttpClient shows text only):
#   wx.txt:   <blank> / <blank> / Now / Hi Lo / Rain / Next <COND_SHORT> /
#             Rain <t> <mm>mm (or No rain 6h) / Rain chance <max>% / UV <max> max
#   aqi.txt:  <blank> / <blank> / PM2.5 <v> AQI <n> / 1 <tc>C <WORD> / 2 ... / 3 ...
#   hist.txt: <blank> / <blank> / <Mon dd> /
#             Warmest since <YYYY> (or Warmest in 40yr) / Avg max <v>C /
#             Today <hi>C <+/-><d> / Record <v>C <YYYY> / Coldest <v>C <YYYY>
#   hist compares today's TMD max (wx.json hi) with ERA5 daily maxima for the
#   same calendar date over the last 40 completed years (no key, ~5-day lag
#   means the current year is never in the ERA5 set, which is correct here).
#   Layout note (from real watch photos): HttpClient centers every line and
#   its circle overlay sits over the top-right, hiding the ends of the first
#   ~2 lines (even a 6-char line lost its last char). Alignment cannot be set
#   from the text, and the user rejected title/context header rows, so rows
#   1-2 are blank (the circle covers nothing) and date + rank sit at row 3,
#   below the circle's reach. This relies on the app preserving blank lines;
#   if it collapses them, date + rank shift up into the clip zone again.
# COND_SHORT follows desk-air index.html (1 CLEAR, 2 P.CLOUDY, 3 CLOUDY,
# 4 OVERCAST, 5 L.RAIN, 6 RAIN, 7 H.RAIN, 8 STORM, 9 V.COLD, 10 COLD,
# 11 COOL, 12 V.HOT).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate wx.txt, aqi.txt and hist.txt
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone, timedelta
          bkk_now = datetime.now(timezone(timedelta(hours=7)))
          with open("wx.json", encoding="utf-8") as f:
              wx = json.load(f)
          url = ("https://air-quality-api.open-meteo.com/v1/air-quality"
                 "?latitude=13.7568&longitude=100.53&current=pm2_5&timezone=Asia%2FBangkok")
          with urllib.request.urlopen(url, timeout=30) as r:
              aq = json.load(r)
          pm25 = float(aq["current"]["pm2_5"])
          bps = [(0.0, 12.0, 0, 50), (12.1, 35.4, 51, 100), (35.5, 55.4, 101, 150),
                 (55.5, 150.4, 151, 200), (150.5, 250.4, 201, 300), (250.5, 350.4, 301, 400),
                 (350.5, 500.4, 401, 500)]
          aqi = 500
          for clo, chi, ilo, ihi in bps:
              if pm25 <= chi:
                  aqi = round((ihi - ilo) / (chi - clo) * (pm25 - clo) + ilo)
                  break
          try:
              uv_url = ("https://api.open-meteo.com/v1/forecast"
                        "?latitude=13.7568&longitude=100.53&daily=uv_index_max"
                        "&timezone=Asia%2FBangkok&forecast_days=1")
              with urllib.request.urlopen(uv_url, timeout=30) as r:
                  uv = json.load(r)["daily"]["uv_index_max"][0]
              uv_line = f"UV {float(uv):.1f} max"
          except Exception:
              uv_line = "UV -- max"
          def f1(v):
              return f"{float(v):.1f}"
          COND = {1: "CLEAR", 2: "P.CLOUDY", 3: "CLOUDY", 4: "OVERCAST",
                  5: "L.RAIN", 6: "RAIN", 7: "H.RAIN", 8: "STORM",
                  9: "V.COLD", 10: "COLD", 11: "COOL", 12: "V.HOT"}
          nxt = wx["next"]
          assert len(nxt) >= 3, "wx.json next[] has fewer than 3 hours"
          # First rainy hour in TMD next[] (rain unused until now)
          rainy = next((h for h in nxt if float(h.get("rain", 0)) >= 0.1), None)
          rain_next = (f"Rain {rainy['t']} {float(rainy['rain']):.1f}mm"
                       if rainy else "No rain 6h")
          # Max precipitation probability over the next 6 hours (Open-Meteo, no key)
          try:
              pop_url = ("https://api.open-meteo.com/v1/forecast"
                         "?latitude=13.7568&longitude=100.53"
                         "&hourly=precipitation_probability"
                         "&timezone=Asia%2FBangkok&forecast_days=2")
              with urllib.request.urlopen(pop_url, timeout=30) as r:
                  pop = json.load(r)
              ptimes = pop["hourly"]["time"]
              pvals = pop["hourly"]["precipitation_probability"]
              cur = bkk_now.strftime("%Y-%m-%dT%H:00")
              i0 = ptimes.index(cur)
              vals6 = [p for p in pvals[i0 + 1:i0 + 7] if p is not None]
              chance = f"Rain chance {max(vals6)}%" if vals6 else "Rain chance --"
          except Exception:
              chance = "Rain chance --"
          wx_txt = (f"\n\n"
                    f"Now {f1(wx['now'])}C\nHi {f1(wx['hi'])}C Lo {f1(wx['lo'])}C\n"
                    f"Rain {f1(wx['rain'])}mm\n"
                    f"Next {COND.get(nxt[0]['cond'], '?')}\n"
                    f"{rain_next}\n{chance}\n{uv_line}\n")
          aqi_txt = (f"\n\n"
                     f"PM2.5 {f1(pm25)} AQI {aqi}\n"
                     f"1 {f1(nxt[0]['tc'])}C {COND.get(nxt[0]['cond'], '?')}\n"
                     f"2 {f1(nxt[1]['tc'])}C {COND.get(nxt[1]['cond'], '?')}\n"
                     f"3 {f1(nxt[2]['tc'])}C {COND.get(nxt[2]['cond'], '?')}\n")
          open("wx.txt", "w", encoding="utf-8").write(wx_txt)
          open("aqi.txt", "w", encoding="utf-8").write(aqi_txt)
          # --- hist.txt: same calendar date, last 40 completed years (ERA5) ---
          try:
              bkk = datetime.now(timezone(timedelta(hours=7)))
              md = bkk.strftime("%m-%d")
              end = (bkk - timedelta(days=7)).strftime("%Y-%m-%d")
              era_url = ("https://archive-api.open-meteo.com/v1/era5"
                         "?latitude=13.7568&longitude=100.53"
                         f"&start_date=1940-01-01&end_date={end}"
                         "&daily=temperature_2m_max&timezone=Asia%2FBangkok")
              with urllib.request.urlopen(era_url, timeout=120) as r:
                  era = json.load(r)
              past = {int(t[:4]): v for t, v in
                      zip(era["daily"]["time"], era["daily"]["temperature_2m_max"])
                      if t[5:] == md and v is not None}
              w40 = {y: v for y, v in past.items()
                     if bkk.year - 40 <= y < bkk.year}
              today_max = float(wx["hi"])
              avg40 = sum(w40.values()) / len(w40)
              warmer = sorted(y for y, v in w40.items() if v > today_max)
              rank = 1 + len(warmer)
              verdict = (f"Warmest since {warmer[-1]}" if warmer
                         else "Warmest in 40yr")
              rec_y = max(w40, key=w40.get)
              cold_y = min(w40, key=w40.get)
              hist_txt = (f"\n\n"
                          f"{bkk.strftime('%b %d')}\n"
                          f"{verdict}\n"
                          f"Avg max {avg40:.1f}C\n"
                          f"Today {today_max:.1f}C {today_max - avg40:+.1f}\n"
                          f"Record {w40[rec_y]:.1f}C {rec_y}\n"
                          f"Coldest {w40[cold_y]:.1f}C {cold_y}\n")
          except Exception:
              hist_txt = None
          if hist_txt is not None:
              open("hist.txt", "w", encoding="utf-8").write(hist_txt)
          print(wx_txt + aqi_txt + (hist_txt or ""))
          PY
      - name: Commit and push if changed
        run: |
          git config user.name "watch-txt-bot"
          git config user.email "watch-txt-bot@users.noreply.github.com"
          git add wx.txt aqi.txt hist.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Refresh watch wx.txt/aqi.txt/hist.txt"
            git push
          fi
