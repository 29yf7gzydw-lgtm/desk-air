name: Update history stats

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute history stats
        env:
          LAT: ${{ secrets.LAT }}
          LNG: ${{ secrets.LNG }}
        run: python update_stats.py
      - name: Commit if changed
        run: |
          git config user.name "desk-air bot"
          git config user.email "actions@github.com"
          git add stats.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update stats.json"
            git push
          fi
